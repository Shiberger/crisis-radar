# Render Blueprint — deploy Crisis Radar เป็น Web Service
#
# วิธีใช้: push repo ขึ้น GitHub → Render Dashboard > New > Blueprint > เลือก repo
# Render จะอ่านไฟล์นี้แล้วตั้งค่าให้เอง เหลือแค่กรอก secret 2 ตัวข้างล่าง
services:
  - type: web
    name: crisis-radar
    runtime: python
    plan: free
    region: singapore # ใกล้ไทยสุด
    buildCommand: "pip install -r requirements.txt" # จริง ๆ ไม่ลงอะไรเลย (stdlib ล้วน) — ใส่ไว้ให้ Render ตรวจเป็น Python service
    startCommand: "python backend/server.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: HOST
        value: "0.0.0.0" # ต้องเป็น 0.0.0.0 ไม่งั้น Render เข้าไม่ถึง (PORT ทาง Render ใส่ให้เอง)
      # --- 2 ตัวนี้ต้องกรอกเองใน Dashboard (sync: false = ไม่เก็บลง git) ---
      - key: APIFY_TOKEN
        sync: false
      - key: RUN_PASSCODE # รหัสกันคนกดโหมด Facebook จริงจนเครดิต Apify หมด
        sync: false
      # --- โหมดเฝ้าเพจอัตโนมัติ (เปิดเว็บมาเห็นสถานะเลย ไม่ต้องกดปุ่ม) ---
      # ตรวจใหม่เมื่อมีคนเปิดหน้าเว็บและผลล่าสุดเก่าเกิน interval — อย่างมาก 1 รอบต่อ interval
      # ไม่ตั้ง MONITOR_ALWAYS เพราะ free tier หลับหลังไม่มีคนใช้ 15 นาที (thread เบื้องหลังตายอยู่ดี)
      - key: MONITOR_INTERVAL_MIN
        value: "60"
      - key: MONITOR_MAX_POSTS
        value: "5"
      # ปล่อยว่าง = อัตโนมัติ (Facebook จริงถ้ามี APIFY_TOKEN ไม่งั้นข้อมูลตัวอย่าง)
      # ใส่ "sample" ถ้าอยากให้เดโม่วิ่งได้โดยไม่แตะเครดิต Apify เลย
      - key: MONITOR_SOURCE
        sync: false
