# Render Blueprint — deploy Crisis Radar เป็น Web Service
#
# วิธีใช้: push repo ขึ้น GitHub → Render Dashboard > New > Blueprint > เลือก repo
# Render จะอ่านไฟล์นี้แล้วตั้งค่าให้เอง เหลือแค่กรอก secret 2 ตัวข้างล่าง
services:
  - type: web
    name: crisis-radar
    runtime: python
    plan: free
    region: singapore # ใกล้ไทยสุด
    buildCommand: "pip install -r requirements.txt" # จริง ๆ ไม่ลงอะไรเลย (stdlib ล้วน) — ใส่ไว้ให้ Render ตรวจเป็น Python service
    startCommand: "python backend/server.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: HOST
        value: "0.0.0.0" # ต้องเป็น 0.0.0.0 ไม่งั้น Render เข้าไม่ถึง (PORT ทาง Render ใส่ให้เอง)
      # --- 2 ตัวนี้ต้องกรอกเองใน Dashboard (sync: false = ไม่เก็บลง git) ---
      - key: APIFY_TOKEN
        sync: false
      - key: RUN_PASSCODE # รหัสกันคนกดโหมด Facebook จริงจนเครดิต Apify หมด
        sync: false
      # --- ชั้น AI ที่สอง (Claude อ่านซ้ำเคสที่ชั้นแรกไม่มั่นใจ) ---
      # ไม่ใส่ = ระบบยังทำงานครบ แต่ชั้นสองใช้กฎ offline แทน (แม่นน้อยกว่ากับมุกใหม่ ๆ)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL # claude-haiku-4-5 = ถูก+เร็ว · เปลี่ยนเป็น claude-sonnet-5 ถ้าอยากแม่นขึ้น
        value: "claude-haiku-4-5"
      - key: LLM_MAX_ITEMS # เพดานคอมเมนต์ที่ส่งเข้า Claude ต่อรอบ — กันบิลบานตอนเพจแตก
        value: "200"
      # --- โหมดเฝ้าเพจอัตโนมัติ (เปิดเว็บมาเห็นสถานะเลย ไม่ต้องกดปุ่ม) ---
      # ตรวจใหม่เมื่อมีคนเปิดหน้าเว็บและผลล่าสุดเก่าเกิน interval — อย่างมาก 1 รอบต่อ interval
      # ไม่ตั้ง MONITOR_ALWAYS เพราะ free tier หลับหลังไม่มีคนใช้ 15 นาที (thread เบื้องหลังตายอยู่ดี)
      - key: MONITOR_INTERVAL_MIN # 2 ชม. — free tier ของ Apify รับรายชั่วโมงไม่ไหว (ดู README)
        value: "120"
      - key: MONITOR_MAX_POSTS
        value: "5"
      # จำรายการ URL โพสต์ไว้ 6 ชม. — ตัด posts scraper (~40% ของค่า Apify ต่อรอบ) ออกจากรอบส่วนใหญ่
      # 0 = ปิด cache · ดูรายละเอียดใน .env.example
      - key: POST_URLS_TTL_MIN
        value: "360"
      # ปล่อยว่าง = อัตโนมัติ (Facebook จริงถ้ามี APIFY_TOKEN ไม่งั้นข้อมูลตัวอย่าง)
      # ใส่ "sample" ถ้าอยากให้เดโม่วิ่งได้โดยไม่แตะเครดิต Apify เลย
      - key: MONITOR_SOURCE
        sync: false
      # --- แจ้งเตือนเข้า Discord ผ่าน n8n (ไม่ตั้ง = ปิดทั้งอัตโนมัติและปุ่มบนหน้าเว็บ) ---
      # URL ของ Webhook node ใน n8n · workflow ตัวอย่าง: n8n/crisis_radar_discord_alert.json
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET # ส่งไปกับ header X-Crisis-Radar-Token ให้ n8n ตรวจก่อนรับ
        sync: false
      - key: ALERT_MIN_REACH # คอมเมนต์ลบที่ไลก์+ตอบกลับถึงเท่านี้ = แจ้งเองทันที
        value: "150"
      - key: ALERT_MAX_PER_RUN # กันข้อความท่วม Discord จนทีมปิดแจ้งเตือน
        value: "5"
      # ลิงก์กลับ dashboard ที่แนบไปในข้อความ — ใส่ URL จริงของ service นี้หลัง deploy รอบแรก
      - key: PUBLIC_URL
        sync: false
